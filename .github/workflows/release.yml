name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is created or built unless the tag matches the app version and the
  # whole workspace passes its tests.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the version in tauri.conf.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="$(printf '%s' "${TAG#v}" | sed -E 's/-rc\.[0-9]+$//')"
          app_version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag $TAG ($tag_version) does not match version $app_version in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "Tag $TAG matches version $app_version"
      - name: CHANGELOG.md has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/changelog-section.sh "${TAG#v}"
      - name: Install Linux dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The Rust version comes from rust-toolchain.toml only.
      - name: Read the Rust toolchain version
        id: toolchain
        shell: bash
        run: |
          channel="$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Same key as the CI `app` job on Ubuntu: a tag can only restore caches saved on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: app-ubuntu-24.04
          save-if: false
      # The shell crate embeds ../dist, so the frontend is built before the tests.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --workspace

  # Publish the release (notes from CHANGELOG.md) before the matrix starts: each platform
  # then uploads its files as soon as its build finishes, and the three never race to create
  # the release.
  create-release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create or update the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/changelog-section.sh "${TAG#v}" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun: keep the release and its files, refresh the notes.
            gh release edit "$TAG" --notes-file notes.md
          elif [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest
          fi
          echo "id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's arm64 macOS runners were never acquired in CI; the Intel
          # runner cross-compiles the universal (Apple Silicon + Intel) build.
          - os: macos-15-intel
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            rust-targets: ''
          - os: ubuntu-24.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The Rust version comes from rust-toolchain.toml only.
      - name: Read the Rust toolchain version
        id: toolchain
        shell: bash
        run: |
          channel="$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.rust-targets }}
      # Restores the dependencies compiled by the CI `release-cache` job on main (a tag can
      # only read caches saved on main); saving here would only create caches no tag can use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.os }}
          save-if: false
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # v1 of the action renamed `assetNamePattern` to `releaseAssetNamePattern`.
          # Keeps every download file name in English.
          releaseAssetNamePattern: partimer_[version]_[platform]_[arch][setup][ext]
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
      # Portable build: the same partimer.exe the installer ships, as a single file. It keeps
      # its data in %APPDATA%\partimer like the installed app.
      - name: Upload the Windows portable exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          name="partimer_${version}_windows_x64_portable.exe"
          exe="target/release/partimer.exe"
          test -f "$exe" || { echo "::error::$exe not found"; exit 1; }
          cp "$exe" "$name"
          gh release upload "$TAG" "$name" --clobber
