name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create the draft once, before the matrix starts, so the three build jobs
  # upload into the same draft instead of racing to create one each.
  create-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists"
          else
            gh release create "$TAG" --draft --verify-tag --title "打工人計時器 $TAG" --notes ""
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's arm64 macOS runners were never acquired in CI; the Intel
          # runner cross-compiles the universal (Apple Silicon + Intel) build.
          - os: macos-15-intel
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            rust-targets: ''
          - os: ubuntu-24.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Keep toolchain in sync with rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: "1.98"
          targets: ${{ matrix.rust-targets }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 打工人計時器 ${{ github.ref_name }}
          releaseDraft: true
          # v1 of the action renamed `assetNamePattern` to `releaseAssetNamePattern`.
          # Keeps every download file name in English.
          releaseAssetNamePattern: partimer_[version]_[platform]_[arch][setup][ext]
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
