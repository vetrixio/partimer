[package]
name = "partimer-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "=1.29.0", features = ["v4"] }
thiserror = "=2.0.21"

[dev-dependencies]
chrono-tz = "=0.10.4"
tempfile = "=3.27.0"
